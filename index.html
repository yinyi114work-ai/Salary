<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的薪資手帳</title><style>:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#352d29;background:#f8f5f0}*{box-sizing:border-box}body{margin:0}.wrap{max-width:740px;margin:auto;padding:28px 18px 80px}.eyebrow{letter-spacing:.22em;font-size:11px;color:#9c8065}h1{font-size:30px;margin:9px 0 5px;font-weight:650}p{color:#8c8178;font-size:13px;line-height:1.7}.hero{background:#453c36;color:white;border-radius:24px;padding:26px;margin:25px 0;box-shadow:0 12px 32px #43372d22}.hero small{color:#dfc9aa}.total{font-size:42px;font-weight:650;letter-spacing:-1px;margin:10px 0}.stats{display:flex;gap:20px;color:#eee0d2;font-size:13px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:25px 0 14px}h2{font-size:18px;margin:0}button{border:0;cursor:pointer;font:inherit}.add{background:#a78765;color:white;border-radius:12px;padding:11px 16px;font-weight:600}.day{background:#fff;border:1px solid #eae3db;border-radius:20px;padding:20px;margin:12px 0;box-shadow:0 5px 16px #594c4010}.dayhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.dayhead strong{font-size:16px}.remove{background:transparent;color:#aa9280;font-size:13px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}label{font-size:12px;color:#786b60;display:flex;flex-direction:column;gap:7px}input{width:100%;border:1px solid #e6ded5;border-radius:10px;background:#fcfaf7;padding:12px;font:inherit;color:#342d27;min-width:0}input:focus{outline:2px solid #c8ad8a}.toggle{display:flex;align-items:center;justify-content:space-between;background:#f8f5f0;padding:12px;border-radius:12px;margin-top:16px;font-size:13px}.toggle input{width:19px;height:19px;accent-color:#a78765}.result{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #eee6de;margin-top:17px;padding-top:15px}.result b{font-size:22px}.detail{color:#8e8175;font-size:12px;margin-top:8px}.settings{background:#eee8df;border-radius:16px;padding:16px;margin-top:22px}.settings summary{cursor:pointer;font-size:13px;color:#65574b}.settings .fields{margin-top:15px}.foot{text-align:center;margin-top:24px}.foot button{background:transparent;color:#846e59;text-decoration:underline;font-size:13px}.note{font-size:12px;color:#8d8176;margin-top:20px}@media(max-width:400px){.total{font-size:35px}.wrap{padding:22px 12px}.day{padding:15px}}</style></head><body><main class="wrap"><div class="eyebrow">PERSONAL PAY JOURNAL</div><h1>我的薪資手帳</h1><p>記錄每一天的工時，讓每一分努力都有清楚的數字。</p><section class="hero"><small>本次預估實領薪資</small><div class="total" id="total">NT$ 0</div><div class="stats"><span id="days">0 個工作日</span><span id="hours">0 小時</span></div></section><div class="toolbar"><h2>工作紀錄</h2><button class="add" id="add">＋ 新增一天</button></div><div id="records"></div><details class="settings"><summary>計算設定與說明</summary><div class="fields"><label>每日正常工時（小時）<input id="regular" type="number" min="0" step="0.25" value="8"></label><label>超時薪資倍率<input id="overtime" type="number" min="1" step="0.01" value="1.34"></label></div><p>雙倍薪：該日所有計薪工時按時薪 2 倍計算，不另外疊加超時倍率。扣除時數會先從出勤時間扣除，再計算正常工時與加班薪資。跨午夜班次會自動計算至隔日。此為個人試算，休息日、例假日、國定假日及其他法定加班情形可能需要不同算法。</p></details><div class="foot"><button id="clear">清空全部紀錄</button></div><p class="note">資料僅保存在目前瀏覽器的本機儲存空間，不會上傳伺服器。清除瀏覽器資料可能使紀錄消失。</p></main><script>
const KEY='personal_salary_journal_v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){state=null}if(!state||!Array.isArray(state.rows))state={regular:8,overtime:1.34,rows:[{id:Date.now(),start:'11:30',end:'22:00',rate:196,breakHours:1,double:false},{id:Date.now()+1,start:'12:00',end:'21:45',rate:196,breakHours:1,double:false}]};state.rows.forEach(r=>{if(r.breakHours===undefined){r.breakHours=(+r.break||0)/60;delete r.break;delete r.deduction}});const $=id=>document.getElementById(id);function fmt(n){return 'NT$ '+n.toLocaleString('zh-TW',{minimumFractionDigits:2,maximumFractionDigits:2})}function mins(t){let p=(t||'00:00').split(':').map(Number);return p[0]*60+p[1]}function calc(r){let start=mins(r.start),end=mins(r.end);if(end<start)end+=1440;let deducted=Math.max(0,+r.breakHours||0);let duration=Math.max(0,(end-start)/60-deducted);let rate=+r.rate||0,reg=+state.regular||8,mult=+state.overtime||1.34;let base=r.double?duration*rate*2:Math.min(duration,reg)*rate+Math.max(0,duration-reg)*rate*mult;return {hours:duration,base,net:base}}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){/* restricted preview: calculation still works */}}function update(){let total=0,hours=0;state.rows.forEach(r=>{let c=calc(r);total+=c.net;hours+=c.hours;let el=document.querySelector('[data-id="'+r.id+'"]');if(el){el.querySelector('.pay').textContent=fmt(c.net);el.querySelector('.detail').textContent=`扣除 ${(+r.breakHours||0).toFixed(2)} 小時 · 計薪 ${c.hours.toFixed(2)} 小時`}});$('total').textContent=fmt(total);$('days').textContent=state.rows.length+' 個工作日';$('hours').textContent=hours.toFixed(2)+' 小時';save()}function render(){let box=$('records');box.innerHTML='';state.rows.forEach((r,i)=>{let el=document.createElement('article');el.className='day';el.dataset.id=r.id;el.innerHTML=`<div class="dayhead"><strong>第 ${i+1} 天</strong><button class="remove" type="button">刪除</button></div><div class="fields"><label>上班時間<input data-k="start" type="time"></label><label>下班時間<input data-k="end" type="time"></label><label>時薪（元）<input data-k="rate" type="number" min="0" step="1"></label><label>扣除時數（小時）<input data-k="breakHours" type="number" min="0" step="0.25" placeholder="例如 0.5 或 1"></label></div><label class="toggle">這一天是否為雙倍薪？<input data-k="double" type="checkbox"></label><div class="result"><span>當日預估薪資</span><b class="pay"></b></div><div class="detail"></div>`;el.querySelectorAll('[data-k]').forEach(inp=>{let k=inp.dataset.k;if(inp.type==='checkbox')inp.checked=!!r[k];else inp.value=r[k];inp.addEventListener('input',()=>{r[k]=inp.type==='checkbox'?inp.checked:inp.value;update()})});el.querySelector('.remove').onclick=()=>{state.rows=state.rows.filter(x=>x.id!==r.id);render()};box.append(el)});update()}$('add').onclick=()=>{let last=state.rows[state.rows.length-1];state.rows.push({id:Date.now()+Math.random(),start:'09:00',end:'18:00',rate:last ? last.rate : 196,breakHours:1,double:false});render()};$('regular').value=state.regular;$('overtime').value=state.overtime;['regular','overtime'].forEach(k=>$(k).addEventListener('input',e=>{state[k]=e.target.value;update()}));$('clear').onclick=()=>{if(confirm('確定清空所有工作紀錄？')){state.rows=[];render()}};render();
</script></body></html>
